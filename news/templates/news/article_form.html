{% extends 'news/base.html' %}

{% block title %}{% if article %}Edit Article{% else %}Create Article{% endif %} - News Application{% endblock %}

{% block content %}
<h2>{% if article %}Edit Article{% else %}Create New Article{% endif %}</h2>

<form method="post" style="max-width: 800px;">
    {% csrf_token %}

    <div style="margin-bottom: 15px;">
        <label for="title" style="display: block; margin-bottom: 5px; font-weight: bold;">Title:</label>
        <input type="text" id="title" name="title" value="{{ article.title|default:'' }}"
               required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label for="publisher" style="display: block; margin-bottom: 5px; font-weight: bold;">Publisher:</label>
        <select id="publisher" name="publisher" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">
            <option value="">Independent</option>
            {% for pub in publishers %}
                <option value="{{ pub.id }}" {% if article and article.publisher.id == pub.id %}selected{% endif %}>
                    {{ pub.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="content" style="display: block; margin-bottom: 5px; font-weight: bold;">Content:</label>
        <textarea id="content" name="content" rows="15" required
                  style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px;">{{ article.content|default:'' }}</textarea>
    </div>

    <div>
        <button type="submit" class="btn btn-success">
            {% if article %}Update Article{% else %}Create Article{% endif %}
        </button>
        <a href="{% url 'news:article_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

{% endblock %}
